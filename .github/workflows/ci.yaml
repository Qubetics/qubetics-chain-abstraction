name: CI

on:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust (use rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@v1
        with:
          components: rustfmt

      - name: Install Protobuf and Libclang
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libclang-dev

      - name: Cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check format
        run: cargo fmt --all --check

      - name: Check
        run: cargo check --all --locked

