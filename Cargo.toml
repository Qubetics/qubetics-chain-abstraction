[package]
name = "mpc-node"
version = "0.1.0"
edition = "2021"


[features]
default = ["eth", "bitcoin", "grpc"]

eth = [
    "dep:ethers",
    "dep:web3",
    "dep:ethereum-types",
    "dep:ethers-core",
    "dep:ethabi",
]

bitcoin = [
    "dep:bitcoin",
    "dep:bip39",
    "dep:bip32",
]

grpc = [
    "dep:tonic",
    "dep:prost",
    "dep:libp2p-grpc-rs",
    "dep:tonic-build",
]

nonce_audit = []

[dependencies]
libp2p = { version = "0.55", features = ["request-response", "cbor", "tokio", "gossipsub", "mdns", "noise", "macros", "tcp", "yamux", "quic", "identify", "kad", "serde"] }
tokio = { version = "1", features = ["full"] }
futures = "0.3"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
ff = "0.13"
group = "0.13"
ecvrf = "0.4"
sha2 = "0.10"
ripemd = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.8"
async-trait = "0.1"
hex = "0.4"
base64 = "0.21"
blake3 = {version = "1.5", features = ["serde"]}
ethereum-types = { version = "0.14", optional = true }
ethers = { version = "2.0", features = ["ws", "rustls"], optional = true }
web3 = { version = "0.19", optional = true }
thiserror = "1.0"
async-stream = "0.3"
dashmap = "5.5"
parking_lot = "0.12"
serde_cbor = "0.11.2"
tonic = { version = "0.13.0", optional = true }
prost = { version = "0.13.5", optional = true }
libp2p-grpc-rs = { version = "0.1.2", optional = true }
tracing-appender = "0.2.3"
once_cell = "1.19"
warp = "0.3"
k256 = "0.13.4"
bitcoin = { version = "0.32.6", default-features = true, optional = true }
bip39 = { version = "2.2.0", optional = true }
bip32 = { version = "0.5.3", optional = true }
ethers-core = { version = "2.0.14", optional = true }
num-bigint = "0.4.6"
rlp = "0.5"
secp256k1 = { version = "0.28", features = ["rand", "recovery"] }
sha3 = "0.10"
num-traits = "0.2.19"
num-integer = "0.1.46"
uuid = { version = "1.0", features = ["v4", "serde"] }
reqwest = { version = "0.11", features = ["json"] }
hmac = "0.12"
chrono = { version = "0.4", features = ["serde"] }
rocksdb = "0.22"
bincode = "1.3"
dotenv = "0.15"
rust_decimal = "1"
rust_decimal_macros = "1"
ethabi = { version = "18.0.0", optional = true }
serde-big-array = "0.5.1"
chacha20poly1305 = "0.10"
clap = { version = "4.4", features = ["derive"] }

[dev-dependencies]
tempfile = "3.8"
wiremock = "0.5"

[build-dependencies]
tonic-build = { version = "0.13.0", optional = true }
